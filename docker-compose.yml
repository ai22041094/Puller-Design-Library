services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-puller_library}
      POSTGRES_USER: ${POSTGRES_USER:-puller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "${POSTGRES_USER:-puller}",
          "-d",
          "${POSTGRES_DB:-puller_library}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    profiles: ["tools"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-puller}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-puller_library}
    depends_on:
      db:
        condition: service_healthy

  account:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["pnpm", "--filter", "@workspace/api-server", "exec", "tsx", "src/cli/account.ts"]
    command: []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-puller}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-puller_library}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-puller}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-puller_library}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS origin}
      UPLOAD_DIR: /data
      LEGACY_PRIVATE_OBJECT_DIR: ${LEGACY_PRIVATE_OBJECT_DIR:-}
    volumes:
      - uploads_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      SERVER_NAME: ${DOMAIN:?Set DOMAIN in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
